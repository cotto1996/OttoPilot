# Page: software
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: software
label: Software
icon: software
order: 7
remote_configurable: true
description: Software update preferences
sections:
- id: updates
  title: Updates
  description: Control software updates
  items:
  - key: SunnylinkUpdateRequest
    widget: multiple_button
    title: Software Update
    description: Check the current branch and download an available update. Restart your device to install it.
    options:
    - value: 1
      label: Update
    enablement:
    - $ref: '#/macros/offroad'
    - {type: param, key: DisableUpdates, equals: false}
  - key: DisableUpdates
    widget: toggle
    title: Disable Updates
    description: When enabled, software updates will be off. This requires a reboot to take effect.
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/advanced_only'
